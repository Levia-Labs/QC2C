version: "3"

# Host-side test loops: seconds instead of a Docker image build per run. The workflow:test-*
# tasks stay the reference gate; these print only the verdict (or the failing excerpt) so an
# agent loop never pipes pytest or jest through tail.
vars:
  LOCAL_GATE: 'uv run --no-project --python ">=3.12"
    "{{.ROOT_DIR}}/.crepidoma/plugins/crepidoma/scripts/gate_runner.py" quiet --'

tasks:
  pipeline:
    desc: "Pipeline unit tests on the host. Usage: task local:pipeline -- [pytest args, paths under workflow/]"
    silent: true
    cmds:
      - "{{.LOCAL_GATE}} uv run --project workflow --all-extras pytest --rootdir workflow
        {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}workflow/tests{{end}}"

  python:
    desc: "Python package tests on the host. Usage: task local:python -- [pytest args, paths under packages/python/]"
    silent: true
    cmds:
      - "{{.LOCAL_GATE}} uv run --project packages/python --with pytest pytest -q --rootdir packages/python
        {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}packages/python/tests{{end}}"

  # npm ci runs only when node_modules lacks this platform's @unrs/resolver-binding (a Linux tree
  # from an old Docker run breaks host jest); npm ci replaces the whole tree.
  node:
    desc: "TypeScript package tests on the host. Usage: task local:node -- [jest args]"
    silent: true
    dir: packages/typescript
    cmds:
      - |
        node -e 'const fs=require("fs");const p="@unrs/resolver-binding-"+process.platform+"-"+process.arch;
        let d=[];try{d=fs.readdirSync("node_modules/@unrs")}catch(e){}
        process.exit(d.some((n)=>n.startsWith(p))?0:1)' || {{.LOCAL_GATE}} npm ci --no-audit --no-fund
      - "{{.LOCAL_GATE}} npx jest {{.CLI_ARGS}}"

  all:
    desc: "Pipeline, Python and TypeScript suites on the host, one verdict each. Usage: task local:all"
    silent: true
    cmds:
      - task: pipeline
      - task: python
      - task: node
