<svg xmlns="http://www.w3.org/2000/svg" width="420" height="120" viewBox="0 0 420 120" role="img" aria-labelledby="title desc">
  <title id="title">QC2C</title>
  <desc id="desc">Globe with a location pin, followed by the QC2C wordmark</desc>
  <defs>
    <linearGradient id="globe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
  </defs>
  <g transform="translate(10 10)">
    <circle cx="50" cy="50" r="46" fill="url(#globe)"/>
    <g fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2.5">
      <ellipse cx="50" cy="50" rx="20" ry="46"/>
      <line x1="50" y1="4" x2="50" y2="96"/>
      <line x1="4" y1="50" x2="96" y2="50"/>
      <path d="M10 28 H90 M10 72 H90"/>
    </g>
    <path d="M68 18 a16 16 0 0 1 16 16 c0 12 -16 28 -16 28 s-16 -16 -16 -28 a16 16 0 0 1 16 -16 z" fill="url(#pin)" stroke="#ffffff" stroke-width="3"/>
    <circle cx="68" cy="34" r="5.5" fill="#ffffff"/>
  </g>
  <text x="128" y="78" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="2" fill="#2563eb">QC<tspan fill="#e11d48">2</tspan>C</text>
  <text x="130" y="102" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" letter-spacing="1.5" fill="#64748b">QUICK COORDINATES TO COUNTRY</text>
</svg>
