[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qc2c"
version = "1.1.0"
description = "Map coordinates to country using sectorized geojson strategy"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "Adam Lewicki" }]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Levia-Labs/QC2C"
Repository = "https://github.com/Levia-Labs/QC2C"
Issues = "https://github.com/Levia-Labs/QC2C/issues"

[tool.setuptools]
packages = ["qc2c", "qc2c.data"]

[tool.setuptools.package-data]
qc2c = ["data/json/*.json", "data/gz/*.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
